<div
  (click)="seleccionar()"
  class="flex items-center justify-between gap-4 p-4 rounded-none border transition-all duration-150 cursor-pointer text-left relative min-h-[110px]"
  [class.bg-[#141718]]="selected()"
  [class.border-[#ccff00]]="selected()"
  [class.ring-1]="selected()"
  [class.ring-[#ccff00]/30]="selected()"
  [class.bg-[#0f1112]]="!selected()"
  [class.border-zinc-600]="!selected()"
  [class.hover:bg-[#111315]]="!selected()"
>

  <!-- ICONO -->
  <div
    class="flex-none"
    [class.text-[#ccff00]]="selected()"
    [class.text-zinc-300]="!selected()"
  >
  <button
  type="button"
  (click)="deleteVehicle($event)"
    class="ml-2 flex-none p-2 border border-transparent hover:border-zinc-700 bg-zinc-900/30 transition-colors"
    title="btnDelete"
  >
    
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
  <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
</svg>
  </button>


  </div>

  <!-- INFORMACIÓN -->
  <div class="flex-1 min-w-0 space-y-1">

    <h3
      class="font-bold text-sm sm:text-base tracking-wide uppercase truncate"
      [class.text-[#ccff00]]="selected()"
      [class.text-white]="!selected()"
    >
      Placa: {{ vehicle().plate }}
    </h3>

    <p class="text-zinc-400 text-xs truncate font-sans">

      Chofer:

      <span class="text-zinc-200 font-mono font-bold">
        {{ vehicle().driver || 'UNASSIGNED' }}
      </span>

    </p>

    <p class="text-zinc-300 text-[9px] tracking-tight truncate">

      FECHA DE REGISTRO:

      {{ vehicle().creation_vehicle || 'No Asignado' }}

    </p>


  </div>

  <!-- EDITAR -->
  <button
    type="button"
    (click)="editar($event)"
    class="ml-2 flex-none p-2 border border-transparent hover:border-zinc-700 bg-zinc-900/30 transition-colors"
    [class.text-[#ccff00]]="selected()"
    [class.text-zinc-300]="!selected()"
    title="Editar vehículo"
  >

    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="1.5"
      stroke="currentColor"
      class="w-4 h-4"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M16.862 3.487a2.25 2.25 0 0 1 3.182 3.182L7.5 19.213 3 20.25l1.037-4.5L16.862 3.487z"
      />
    </svg>

  </button>

</div>
