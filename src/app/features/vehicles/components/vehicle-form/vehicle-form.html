<!-- FECHA -->
<div class="space-y-1.5">

  <label
    class="text-[9px] font-bold text-zinc-300 uppercase tracking-widest block text-left text-white"
  >
    FECHA DE REGISTRO DEL CONDUCTOR (AÑO-MES-DÍA)
  </label>

  <input
    required
    type="date"
    name="creation_vehicle"
    [(ngModel)]="form.creation_vehicle"
    class="w-full px-3 py-2.5 text-xs text-zinc-200 bg-[#090a0b] border border-zinc-600 focus:outline-none focus:border-[#ccff00] transition-all rounded-none"
  />

</div>

<!-- PLACA -->
<div class="space-y-1.5">

  <label
    class="text-[9px] font-bold text-zinc-300 uppercase tracking-widest block text-left"
  >
    NUMERO DE PLACA
  </label>

  <input
    required
    type="text"
    name="plate"
    [(ngModel)]="form.plate"
    placeholder="Ej. ABC-123"
    class="w-full px-3 py-2.5 text-xs text-zinc-200 bg-[#090a0b] border border-zinc-600 focus:outline-none focus:border-[#ccff00] transition-all rounded-none uppercase"
  />

</div>

<!-- CHOFER -->
<div class="space-y-1.5">

  <label
    class="text-[9px] font-bold text-zinc-300 uppercase tracking-widest block text-left"
  >
    CHOFER ASIGNADO
  </label>

  <input
    type="text"
    name="driver"
    [(ngModel)]="form.driver"
    placeholder="Nombre completo del taxista..."
    class="w-full px-3 py-2.5 text-xs text-zinc-200 bg-[#090a0b] border border-zinc-600 focus:outline-none focus:border-[#ccff00] transition-all font-sans rounded-none"
  />

</div>
