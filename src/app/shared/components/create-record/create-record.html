<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-xs overflow-y-auto"
>

  <div
    class="bg-[#0f1112] w-full max-w-md border border-zinc-700 p-5 sm:p-6 relative flex flex-col gap-5 text-left rounded-none my-auto"
  >

    <!-- CABECERA -->

    <div
      class="flex justify-between items-center pb-2 border-b border-zinc-600"
    >

      <div class="min-w-0 flex-1 pr-2">

        <h3
          class="text-xs sm:text-sm font-bold text-white uppercase tracking-wider truncate"
        >
            {{ record() ? 'EDITAR REGISTRO' : 'CREAR REGISTRO' }}
        </h3>

        <p
          class="text-[10px] text-zinc-300 mt-0.5 truncate"
        >

          PLACA PARA EL REGISTRO:

          <span class="text-[#ccff00] font-bold">
            {{ vehiclePlate() }}
          </span>

        </p>

      </div>


      <!-- CERRAR -->

      <button
        type="button"
        (click)="cerrar()"
        class="text-zinc-300 hover:text-white p-1.5 hover:bg-zinc-800 transition-colors border border-transparent hover:border-zinc-700 flex-none cursor-pointer"
      >

        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2.5"
          stroke="currentColor"
          class="w-4 h-4"
        >

          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6 18 18 6M6 6l12 12"
          />

        </svg>

      </button>

    </div>


    <!-- FORMULARIO -->

    <form
      (submit)="$event.preventDefault(); guardar()"
      class="space-y-4"
    >

      @if (validationError()) {
        <p class="border border-red-900 bg-red-950/30 px-3 py-2 text-[10px] text-red-400 uppercase" role="alert">
          {{ validationError() }}
        </p>
      }

      <!-- DESCRIPCIÓN -->

      <div class="space-y-1.5">

        <label
          class="text-[9px] font-bold text-zinc-300 uppercase tracking-widest"
        >
          DESCRIPCIÓN:
        </label>

        <textarea
          required
          rows="4"
          [ngModel]="description()"
          (ngModelChange)="description.set($event)"
          name="description"
          placeholder="INSERTE LA DESCRIPCIÓN DEL REGISTRO"
          class="w-full px-3 py-2 text-xs text-zinc-200 bg-[#090a0b] border border-zinc-600 focus:outline-none focus:border-[#ccff00] transition-all resize-none font-sans rounded-none"
        ></textarea>

      </div>


      <!-- PRECIO -->

      <div class="space-y-1.5">

        <span
          class="text-[9px] font-bold text-zinc-300 uppercase tracking-widest"
        >
          TIPO DE MOVIMIENTO:
        </span>

        <div class="grid grid-cols-2 border border-zinc-600">

          <button
            type="button"
            (click)="recordType.set('ingreso')"
            [class.bg-[#ccff00]]="recordType() === 'ingreso'"
            [class.text-black]="recordType() === 'ingreso'"
            [class.text-zinc-300]="recordType() !== 'ingreso'"
            class="px-3 py-2 text-[10px] font-bold uppercase tracking-widest border-r border-zinc-600 hover:bg-[#ccff00] hover:text-black transition-colors"
          >
            INGRESO
          </button>

          <button
            type="button"
            (click)="recordType.set('egreso')"
            [class.bg-[#ccff00]]="recordType() === 'egreso'"
            [class.text-black]="recordType() === 'egreso'"
            [class.text-zinc-300]="recordType() !== 'egreso'"
            class="px-3 py-2 text-[10px] font-bold uppercase tracking-widest hover:bg-[#ccff00] hover:text-black transition-colors"
          >
            EGRESO
          </button>

        </div>

      </div>

      <!-- PRECIO -->

      <div class="space-y-1.5">

        <label
          class="text-[9px] font-bold text-zinc-300 uppercase tracking-widest"
        >
          VALOR DEL REGISTRO
        </label>

        <div class="relative">

          <span
            class="absolute inset-y-0 left-0 pl-3 flex items-center text-zinc-300 text-xs font-bold"
          >
            $
          </span>

          <input
  type="text"
  appNumberFormat
  [ngModel]="price() ? price()!.toLocaleString('de-DE') : ''"
  (ngModelChange)="price.set($event ? +$event.replace(/\D/g, '') : null)"
  name="price"
  placeholder="0"
  class="w-full pl-7 pr-3 py-2 text-xs text-zinc-200 bg-[#090a0b] border border-zinc-600 focus:outline-none focus:border-[#ccff00] transition-all rounded-none"
/>

        </div>

      </div>


      <!-- BOTONES -->

      <div
        class="flex gap-2 justify-end pt-3 border-t border-zinc-600 mt-5"
      >

        <button
          type="button"
          (click)="cerrar()"
          [disabled]="isSaving()"
          class="px-4 py-2.5 text-[10px] font-bold text-zinc-400 hover:text-white bg-zinc-900 border border-zinc-600 hover:border-zinc-700 transition-all cursor-pointer uppercase rounded-none disabled:opacity-40"
        >
          CANCELAR
        </button>


        <button
          type="submit"
          [disabled]="isSaving()"
          class="px-4 py-2.5 text-[10px] font-bold text-black bg-[#ccff00] hover:bg-[#bce600] transition-all cursor-pointer flex items-center gap-2 uppercase rounded-none disabled:bg-zinc-700 disabled:text-zinc-400"
        >

          @if (isSaving()) {

            <div
              class="w-2.5 h-2.5 border-2 border-black border-t-transparent animate-spin rounded-full"
            ></div>

            <span>
              CREANDO...
            </span>

          } @else {

              <span>
                {{ record() ? 'GUARDAR CAMBIOS' : 'CREAR REGISTRO' }}
            </span>

          }

        </button>

      </div>

    </form>

  </div>

</div>
