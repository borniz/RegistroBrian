@if (isOpen()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-xs overflow-y-auto font-mono">
<div class="bg-[#0f1112] w-full border border-zinc-700 p-5 sm:p-6 relative flex flex-col gap-5 text-left rounded-none my-auto border-t-[#ccff00]/50 {{ size() }}">      
      <!-- Cabecera Común -->
      <div class="flex justify-between items-center pb-2 border-b border-zinc-600">
        <div class="min-w-0 flex-1 pr-2">
          <h3 class="text-xs sm:text-sm font-bold text-white uppercase tracking-wider truncate">
            {{ modalTitle() }}
          </h3>
          <p class="text-[10px] text-zinc-300 mt-0.5 truncate">
            {{ modalSubtitle() }}
          </p>
        </div>
        <button
          type="button"
          (click)="cerrar()"
          class="text-zinc-300 hover:text-white p-1.5 hover:bg-zinc-800 transition-colors border border-transparent hover:border-zinc-700 flex-none cursor-pointer"
        >
          <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Formulario Proyectado -->
      <form (submit)="$event.preventDefault(); enviarFormulario()" class="space-y-4">
        
        <!-- El contenido del formulario específico de cada página caerá exactamente aquí -->
        <ng-content></ng-content>

        <!-- Botones de Acción Inferiores Comunes -->
        <div class="flex gap-2 justify-end pt-3 border-t border-zinc-600 mt-5">
          <button
            type="button"
            [disabled]="isSaving()"
            (click)="cerrar()"
            class="px-4 py-2.5 text-[10px] font-bold text-zinc-400 hover:text-white bg-zinc-900 border border-zinc-600 hover:border-zinc-700 transition-all cursor-pointer uppercase rounded-none disabled:opacity-40"
          >
            CANCELAR
          </button>
          @if(showSubmit() && modalTitle()!=='REGISTROS DE LA UNIDAD'){

            <button
              type="submit"
              [disabled]="isSaving()"
              class="px-4 py-2.5 text-[10px] font-bold text-black bg-[#ccff00] hover:bg-[#bce600] transition-all cursor-pointer flex items-center gap-2 uppercase rounded-none disabled:bg-zinc-700 disabled:text-zinc-400"
            >
              @if (isSaving()) {
                <div class="w-2.5 h-2.5 border-2 border-black border-t-transparent animate-spin rounded-full"></div>
                <span>PROCESANDO...</span>
              } @else {
                <span>CONFIRMAR ACCIÓN</span>
              }
            </button>
          }
        </div>

      </form>
    </div>
  </div>
}
