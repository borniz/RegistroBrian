<div class="space-y-8">
	<app-header-page titlePage="TIENDA" headingPage="Control operativo y financiero de la tienda" createElement="Registrar Tienda" elementUnit="tiendas" [elementAssets]="entities().length" (onOpenModal)="openCreate()" />
	<app-business-entity-list [entities]="entities()" [selected]="selected()" entityLabel="TIENDA" (onSelect)="selectEntity($event)" (onEdit)="openEdit($event)" (onDelete)="removeEntity($event)" />
	<app-record-summary [records]="allRecords()" title="REPORTES DE LA TIENDA" scopeLabel="TODAS LAS TIENDAS" (onPeriodSelected)="openReport($event)" />
</div>

<app-create-edit-element [isOpen]="isReportModalOpen()" [modalTitle]="reportPeriod() === 'weekly' ? 'REPORTE SEMANAL' : 'REPORTE MENSUAL'" modalSubtitle="BALANCE GLOBAL DE LA TIENDA" size="max-w-5xl" [showSubmit]="false" (onClose)="closeReport()">
	<app-record-summary [records]="allRecords()" [entityLabels]="entityLabels()" scopeLabel="TODAS LAS TIENDAS" [detailOnly]="true" [period]="reportPeriod()" />
</app-create-edit-element>

<app-create-edit-element [isOpen]="isEntityModalOpen()" modalTitle="CREAR TIENDA" modalSubtitle="REGISTRO OPERATIVO" [isSaving]="isSaving()" (onClose)="closeEntityModal()" (onSubmitForm)="createForm.guardar()">
	<app-business-entity-form #createForm [labels]="{ name: 'NOMBRE DE LA TIENDA', description: 'DESCRIPCION DE LA TIENDA' }" [isSaving]="isSaving()" (onSave)="saveEntity($event)" />
</app-create-edit-element>

<app-create-edit-element [isOpen]="isEditEntityModalOpen()" modalTitle="EDITAR TIENDA" modalSubtitle="ACTUALIZAR REGISTRO" [isSaving]="isSaving()" (onClose)="closeEntityModal()" (onSubmitForm)="editForm.guardar()">
	<app-business-entity-form #editForm [entity]="entityToEdit()" [labels]="{ name: 'NOMBRE DE LA TIENDA', description: 'DESCRIPCION DE LA TIENDA' }" [isSaving]="isSaving()" (onSave)="saveEntity($event)" />
</app-create-edit-element>

@if (selected()) {
	<app-create-edit-element [isOpen]="isHistoryModalOpen()" modalTitle="HISTORIAL DE REGISTROS" modalSubtitle="AUDITORIA FINANCIERA" size="max-w-5xl" [showSubmit]="false" (onClose)="closeHistory()">
		<app-record-history [records]="records()" [entityName]="selected()!.name" (onCreateRecord)="openCreateRecord()" (onEditRecord)="editRecord($event)" (onDeleteRecord)="deleteRecord($event)" />
	</app-create-edit-element>
}

@if (isRecordModalOpen() && selected()) {
	<app-create-edit-element [isOpen]="isRecordModalOpen()" [modalTitle]="recordToEdit() ? 'EDITAR REGISTRO' : 'CREAR REGISTRO'" modalSubtitle="MOVIMIENTO FINANCIERO" [isSaving]="isSaving()" (onClose)="closeRecord()" (onSubmitForm)="recordForm.guardar()">
		<app-create-record #recordForm [vehiclePlate]="selected()!.name" [record]="recordToEdit()" [isSaving]="isSaving()" (onSubmitRecord)="saveRecord($event)" (onClose)="closeRecord()" />
	</app-create-edit-element>
}
